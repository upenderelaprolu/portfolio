name: Build and deploy ASP.NET app to Azure Web App - newweb1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore

      - name: Build and publish ASP.NET application
        shell: cmd
        run: >
          msbuild
          /nologo
          /verbosity:minimal
          /t:Build
          /t:PipelinePreDeployCopyAllFilesToOneFolder
          /p:Configuration=Release
          /p:_PackageTempDir="${{ github.workspace }}\published\"

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published/
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: published/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_78B996D2EED346B9A5BC73426A09918F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5BAC7416A21D41A68C9D172F7E6AE514 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC36CE4ECCAD438A8F2F9244B780ECCF }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: newweb1
          slot-name: Production
          package: published/
