name: Deploy static portfolio to Azure Web App - newweb1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create deployment package
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "portfolio.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\*" -DestinationPath $zipPath -Force
          Write-Host "Deployment package created: $zipPath"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_78B996D2EED346B9A5BC73426A09918F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5BAC7416A21D41A68C9D172F7E6AE514 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC36CE4ECCAD438A8F2F9244B780ECCF }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: newweb1
          slot-name: Production
          package: ${{ github.workspace }}/portfolio.zip
