name: Deploy portfolio to Azure Web App - uppuweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_61530690F9EB437D89E9EEAE9480D08D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_89D5D8CBC59E41AF85E577EEB8D9D9C0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0A90162253B54D5EA56005C52D1A0E45 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: uppuweb
          slot-name: Production
          package: .
