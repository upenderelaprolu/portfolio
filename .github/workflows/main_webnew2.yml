name: Build and deploy ASP.NET app to Azure Web App - webnew2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore

      - name: Build and publish application
        shell: pwsh
        run: |
          msbuild /nologo /verbosity:minimal `
            /t:Build `
            /t:PipelinePreDeployCopyAllFilesToOneFolder `
            /p:Configuration=Release `
            /p:_PackageTempDir="${{ github.workspace }}\published\"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published/
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: published/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_01F4622EE0BE48F7B4459807B8CAAECD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C6EE8EF463E842A588CCCC7379651831 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2D99F49D486A4631B48E436DFDFF1C9C }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: webnew2
          slot-name: Production
          package: published/
